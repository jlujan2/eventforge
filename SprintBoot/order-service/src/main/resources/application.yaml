spring:
  application:
    name: order-service

  kafka:
    bootstrap-servers:
      - localhost:9092
      - localhost:9094
      - localhost:9095

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
server:
  port: 8080